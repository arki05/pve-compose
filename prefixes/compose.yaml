# The `compose` prefix: a docker compose stack managed by pve-compose.
# Installed to /usr/share/pve-meta/prefixes/compose.yaml; a cluster override
# lives at /etc/pve/meta.d/prefixes/compose.yaml.
#
# Defaults that come from `pve-compose config` are described, not declared
# here, so the two never disagree.
description: docker compose stack managed by pve-compose
selector: { tag: compose }
schema:
  type: object
  properties:
    stack:
      type: object
      description: The stack directory /opt/stack on the rootfs.
      properties:
        owner:
          type: string
          description: uid:gid for volume directories and ${PVE_UID}/${PVE_GID} (default from `pve-compose config`).
    policy:
      type: object
      description: What the daemon does on its own; a hand-run verb always does everything.
      properties:
        pct:
          type: string
          enum: [auto, manual]
          default: auto
          description: Reconcile disks, features and tag when the document changes.
        docker:
          type: string
          enum: [auto, manual]
          default: auto
          description: Render and push the compose file when the document changes; compose up only if the stack is already up.
        pull:
          type: string
          enum: [auto, manual]
          default: manual
          description: Pull newer images before compose up.
    spec:
      type: object
      multiline: true
      description: The compose document. Named volumes get x-pve {storage,size,owner,backup} for a disk or {path} for a host bind; others are directories on the stack disk.
